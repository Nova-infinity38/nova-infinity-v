<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App.Nova.Infinity - Votre Solution SaaS Artisans Sur-Mesure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col" x-data="novaApp()">

    <!-- LANDING PAGE -->
    <div x-show="!isSubscribed" class="w-full max-w-4xl mx-auto px-4 py-12 space-y-8 flex-grow flex flex-col justify-center">
        <div class="text-center space-y-3">
            <h1 class="text-3xl font-extrabold text-slate-900">Concentrez-vous sur vos chantiers, nous prenons soin de votre gestion.</h1>
            <p class="text-sm text-slate-500">Solution SaaS pour artisans et professionnels du bâtiment.</p>
        </div>

        <div class="bg-white p-8 rounded-3xl shadow-xl border border-slate-200 space-y-6">
            <div class="space-y-4">
                <h3 class="font-bold text-sm text-slate-900">1. Choisissez votre formule :</h3>
                <div class="grid grid-cols-2 gap-4">
                    <label class="p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="setupTier" value="390" x-model="selectedSetupFee">
                        <strong class="block text-sm mt-2">Pack Artisan — 390 € HT</strong>
                    </label>
                    <label class="p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-50">
                        <input type="radio" name="setupTier" value="499" x-model="selectedSetupFee">
                        <strong class="block text-sm mt-2">Pack PME — 499 € HT</strong>
                    </label>
                </div>
            </div>

            <div class="space-y-4">
                <h3 class="font-bold text-sm text-slate-900">2. Vos Informations :</h3>
                <input type="text" x-model="managerName" placeholder="Votre Nom" class="w-full border border-slate-300 rounded-xl p-3">
                <input type="text" x-model="companyName" placeholder="Nom de l'entreprise" class="w-full border border-slate-300 rounded-xl p-3">
            </div>

            <button @click="startApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-bold text-sm transition">
                🚀 Accéder à mon Espace Pro
            </button>
        </div>
    </div>

    <!-- ESPACE PRO -->
    <div x-show="isSubscribed" style="display: none;" class="min-h-screen flex flex-col w-full bg-slate-900 text-white p-8">
        <div class="max-w-4xl mx-auto w-full space-y-6">
            <div class="flex justify-between items-center border-b border-slate-800 pb-4">
                <h1 class="text-xl font-bold" x-text="companyName"></h1>
                <button @click="isSubscribed = false" class="bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl text-xs">Quitter</button>
            </div>
            <div class="bg-slate-800 p-6 rounded-2xl border border-slate-700 space-y-4">
                <h2 class="text-base font-bold text-amber-400">📝 Espace de Gestion & Devis</h2>
                <p class="text-xs text-slate-300">Dirigeant : <span x-text="managerName"></span></p>
            </div>
        </div>
    </div>

    <script>
        function novaApp() {
            return {
                isSubscribed: false,
                selectedSetupFee: '390',
                managerName: 'Thomas Nova',
                companyName: 'Nova Plomberie',
                startApp() {
                    this.isSubscribed = true;
                }
            }
        }
    </script>
</body>
</html>
